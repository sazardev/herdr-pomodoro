id = "sazardev.pomodoro"
name = "Pomodoro"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Minimal, elegant, theme-adaptive Pomodoro timer -- dockable pane, quick-glance popup, and global shortcuts."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

# Herdr doesn't run plugin commands at install/link time, only when its
# server (re)starts. This is the closest thing to "show setup right after
# installing": the first time Herdr starts after install, no onboarding
# marker exists yet, so this opens the pane straight into the setup
# wizard. Every later restart it's a silent no-op (see src/onboard.rs).
[[startup]]
command = ["./target/release/herdr-pomodoro", "auto-open"]

# Main dockable widget. Open it wherever you like (split/tab/zoomed) with
# `herdr plugin pane open`, then use Herdr's normal pane.move/swap to park
# it in a drawer on the left, right, wherever suits your layout. Placement
# is explicit here (rather than left to Herdr's default) because an
# unspecified placement registers this pane as "overlay" -- fullscreen,
# capturing all input -- which froze other panes solid during testing.
[[panes]]
id = "timer"
title = "Pomodoro"
placement = "split"
command = ["./target/release/herdr-pomodoro", "run"]

# Small transient popup for a quick glance without touching your layout.
[[panes]]
id = "quick"
title = "Pomodoro"
placement = "popup"
width = 44
height = 14
command = ["./target/release/herdr-pomodoro", "run"]

[[actions]]
id = "open"
title = "Pomodoro: open pane"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "open"]

[[actions]]
id = "toggle"
title = "Pomodoro: start / pause"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "toggle"]

[[actions]]
id = "skip"
title = "Pomodoro: skip to next phase"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "skip"]

[[actions]]
id = "reset"
title = "Pomodoro: reset current phase"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "reset"]

[[actions]]
id = "cycle-mood"
title = "Pomodoro: cycle view (minimal/digital/analog/flashy)"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "cycle-mood"]

[[actions]]
id = "cycle-preset"
title = "Pomodoro: cycle preset"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "cycle-preset"]

[[actions]]
id = "reset-onboarding"
title = "Pomodoro: redo first-run setup"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "reset-onboarding"]

# Default shortcuts live under prefix+alt+... to avoid colliding with
# Herdr's own prefix+<letter> bindings. Rebind freely in your own
# ~/.config/herdr/config.toml -- these are just sane defaults.
[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "sazardev.pomodoro.open"
description = "pomodoro: open/focus pane"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "sazardev.pomodoro.toggle"
description = "pomodoro: start/pause"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "sazardev.pomodoro.skip"
description = "pomodoro: skip phase"

[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "sazardev.pomodoro.reset"
description = "pomodoro: reset phase"

[[keys.command]]
key = "prefix+alt+m"
type = "plugin_action"
command = "sazardev.pomodoro.cycle-mood"
description = "pomodoro: cycle view"
