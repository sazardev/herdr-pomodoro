[package]
name = "herdr-pomodoro"
version = "0.2.0"
edition = "2021"
description = "A minimal, elegant, theme-adaptive Pomodoro timer plugin for Herdr"
license = "MIT"
authors = ["sazardev"]
repository = "https://github.com/sazardev/herdr-pomodoro"

[[bin]]
name = "herdr-pomodoro"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
